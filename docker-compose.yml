services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0
    container_name: sigesguarda-mlflow 
    restart: unless-stopped 
    init: true 

    ports:
      - "127.0.0.1:5000:5000"

    command:
      - mlflow 
      - server 
      - --host
      - 0.0.0.0 
      - --port 
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/database/mlflow.db 
      - --artifacts-destination 
      - /mlflow/artifacts 
      - --allowed-hosts 
      - "localhost:*,127.0.0.1:*,mlflow:*"
    
    volumes:
      - mlflow_database:/mlflow/database
      - mlflow_artifacts:/mlflow/artifacts

volumes:
  mlflow_database:
  mlflow_artifacts: